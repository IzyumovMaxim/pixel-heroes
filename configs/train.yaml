checkpoint: "HuggingFaceTB/SmolLM-135M"
adapter_dir: "lora_adapter_early_stop"
seed: 42

lora:
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
  lora_dropout: 0.1
  bias: "none"
  r: 8
  lora_alpha: 16

training:
  learning_rate: 2.0e-4
  eval_size: 1000
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 16
  num_train_epochs: 10
  weight_decay: 0.01
  report_to: "tensorboard"
  eval_steps: 50
  logging_steps: 10
  early_stopping_patience: 5
  save_steps: 50
  save_total_limit: 3
